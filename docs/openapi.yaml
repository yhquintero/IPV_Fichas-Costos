openapi: 3.0.3
info:
  title: IPV Fichas y Costos API
  description: |
    Sistema profesional de gestión de Fichas de Costo y Controles de IPV.
    
    ## Autenticación
    La API soporta autenticación por token JWT. Incluir el token en el header:
    ```
    Authorization: Bearer <token>
    ```
    
    ## Acceso y recuperación de licencia
    Una licencia vencida responde 402 para toda la API de datos. El administrador
    puede usar los endpoints de mantenimiento para autenticarse y emitir una licencia
    nueva; los demás roles no pueden acceder al Creador ni usar el mantenimiento.
    Las conexiones de eventos se revalidan en cada emisión y dejan de enviar datos
    cuando caduca la licencia o se revoca la sesión.

    ## Rate Limiting
    Todos los endpoints tienen rate limiting. Los headers de respuesta incluyen:
    - `X-RateLimit-Limit`: Límite máximo de requests
    - `X-RateLimit-Remaining`: Requests restantes
    - `X-RateLimit-Reset`: Timestamp de reseteo

    ## Sistema de Seguridad por Usuarios
    Además del rol (admin / editor / viewer), cada usuario tiene permisos finos por
    módulo que el administrador ajusta en `PUT /api/users/{id}`:

    | Módulo | Apartado |
    |---|---|
    | `materials` | **Valores del IPV** (entrada única con las pestañas Valores e Inventario) |
    | `products` | Productos y servicios |
    | `fichas` | Fichas de costo |
    | `controls` | Controles de IPV |
    | `trash` | Papelera de reciclaje |

    Permisos de cada módulo: `view` (consultar), `edit` (crear, modificar, ajustar
    existencias, restaurar y purgar) y `costs` (ver precios e importes).

    * Sin `view` la ruta responde **403** con `{"permission_denied": "modulo.permiso"}`.
    * Sin `costs` los campos económicos (`unit_price`, `stock_value`, totales en dinero)
      viajan como `null` y la respuesta añade `costs_hidden: true`: no se ocultan solo
      en la interfaz, el servidor no los envía.
    * Los permisos se leen en cada petición: un cambio surte efecto al instante, sin
      cerrar sesiones ni pedir un nuevo inicio de sesión.
    * Los administradores conservan siempre todos los permisos (no pueden limitarse).
    
    ## Autor
    Ing. Yosvany Hernández Quintero
  version: 1.1.0
  contact:
    name: IPV Support
  license:
    name: Propietaria

servers:
  - url: https://sqlserver:8443
    description: Servidor local HTTPS (las rutas también aceptan el prefijo /api/v1)
  - url: http://localhost:8000
    description: Servidor de desarrollo

tags:
  - name: Health
    description: Endpoints de salud del sistema
  - name: License
    description: Licencia por período del servidor (sin licencia vigente la API responde 402)
  - name: Authentication
    description: Autenticación y gestión de tokens
  - name: Dashboard
    description: Resumen y estadísticas
  - name: Products
    description: Gestión de productos y servicios
  - name: Materials
    description: Gestión de valores de referencia (IPV)
  - name: Fichas
    description: Gestión de fichas de costo
  - name: Controls
    description: Gestión de controles de IPV
  - name: Search
    description: Búsqueda global
  - name: Reports
    description: Generación de reportes
  - name: System
    description: Operaciones del sistema

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Verificar salud del servidor
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Servidor operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/license:
    get:
      tags: [License]
      summary: Estado de la licencia y código de solicitud del equipo
      operationId: getLicense
      security: []
      responses:
        '200':
          description: Estado de la licencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  enforced: {type: boolean, description: false si el servidor no tiene clave pública (modo desarrollo)}
                  valid: {type: boolean}
                  setup_required: {type: boolean, description: Primera instalación sin clave pública (acceso a datos bloqueado)}
                  reason: {type: string, description: Motivo si no es válida}
                  request_code: {type: string, example: IPVW-ABCDE-FGHIJ-KLMNO-PQRST-XY, description: ID del equipo (SHA-256 con sal) para solicitar la licencia}
                  whatsapp: {type: string}
                  user: {type: string}
                  plan: {type: string, enum: [1S, 1M, 3M, 6M, 1A, 2A]}
                  plan_name: {type: string}
                  serial: {type: string}
                  issued_at: {type: integer}
                  expires_at: {type: integer}
                  days_left: {type: integer}
                  plans: {type: object, additionalProperties: {type: object}}
    post:
      tags: [License]
      summary: Activar o renovar la licencia
      description: Sin licencia vigente no requiere sesión; para renovar una licencia vigente se necesita rol admin.
      operationId: activateLicense
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license]
              properties:
                license: {type: string, description: Licencia firmada IPV1.… emitida por el Keygen}
      responses:
        '200': {description: Licencia activada}
        '400': {description: Licencia no válida (firma, dispositivo, app o fecha)}
        '401': {description: Renovación sin sesión}
        '403': {description: Renovación sin rol admin}
        '409': {description: Licencias desactivadas en este servidor}

  /api/auth/maintenance-login:
    post:
      tags: [Authentication, License]
      summary: Iniciar sesión como administrador para recuperar una licencia vencida
      description: No habilita la API de datos; exige rol admin y admite MFA si está activado. Comparte el límite de intentos con el login normal.
      operationId: maintenanceLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, format: password}
                otp: {type: string}
      responses:
        '200': {description: Tokens de administrador para recuperar la licencia}
        '401': {description: Credenciales o segundo factor inválidos}
        '403': {description: La cuenta no es administradora}

  /api/auth/maintenance-refresh:
    post:
      tags: [Authentication, License]
      summary: Renovar tokens de mantenimiento (solo administrador)
      operationId: maintenanceRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: {type: string}
      responses:
        '200': {description: Tokens rotados}
        '401': {description: Sesión inválida o revocada}
        '403': {description: La cuenta no es administradora}

  /api/keygen/status:
    get:
      tags: [License]
      summary: Creador de Licencias — estado del sistema de licencias
      description: Solo administradores. Exenta del bloqueo por licencia para poder emitir la licencia del propio servidor.
      operationId: keygenStatus
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema:
                type: object
                properties:
                  configured: {type: boolean, description: true si hay clave pública de licencias}
                  fingerprint: {type: string, description: Huella SHA-256 de la clave pública}
                  has_key_file: {type: boolean, description: Existe keygen/clave_privada.json}
                  whatsapp: {type: string}
                  plans: {type: object, additionalProperties: {type: object}}
                  rates: {type: object, additionalProperties: {type: number}}
                  ledger_count: {type: integer}
                  license: {type: object}
        '401': {description: Sin sesión}
        '403': {description: Solo administradores}

  /api/keygen/init:
    post:
      tags: [License]
      summary: Creador de Licencias — crear (o reemplazar) la clave de firma
      description: Genera la pareja ECDSA P-256, guarda la clave privada cifrada en keygen/clave_privada.json, escribe la clave pública en licencia.py y License.kt, y activa las licencias sin reiniciar.
      operationId: keygenInit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passphrase]
              properties:
                passphrase: {type: string, minLength: 10, description: Contraseña que cifra la clave privada (no se guarda en el servidor)}
                whatsapp: {type: string, example: "5355555555"}
                force: {type: boolean, description: Requerido si ya existe una clave; invalida TODAS las licencias emitidas}
      responses:
        '200': {description: Clave creada y licencias activadas}
        '400': {description: Contraseña corta o clave existente sin force}
        '401': {description: Sin sesión}
        '403': {description: Solo administradores}

  /api/keygen/emit:
    post:
      tags: [License]
      summary: Creador de Licencias — emitir una licencia firmada
      operationId: keygenEmit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, code, plan, passphrase]
              properties:
                user: {type: string}
                code: {type: string, example: IPVW-ABCDE-FGHIJ-KLMNO-PQRST-XY}
                plan: {type: string, enum: [1S, 1M, 3M, 6M, 1A, 2A]}
                passphrase: {type: string}
      responses:
        '200':
          description: Licencia emitida (queda registrada en keygen/registro_licencias.csv)
          content:
            application/json:
              schema:
                type: object
                properties:
                  license: {type: string, example: IPV1.…}
                  reply: {type: string, description: Mensaje listo para WhatsApp}
                  app: {type: string, enum: [W, A]}
                  serial: {type: string}
                  price_usd: {type: number}
                  price_cup: {type: number}
        '400': {description: Código, plan o contraseña no válidos}
        '401': {description: Sin sesión}
        '403': {description: Solo administradores}

  /api/keygen/verify:
    post:
      tags: [License]
      summary: Creador de Licencias — verificar una licencia
      operationId: keygenVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [license]
              properties:
                license: {type: string}
      responses:
        '200': {description: Firma y contenido válidos}
        '400': {description: Licencia no válida}

  /api/keygen/ledger:
    get:
      tags: [License]
      summary: Creador de Licencias — licencias emitidas
      operationId: keygenLedger
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 100, maximum: 500}}
      responses:
        '200':
          description: Historial reciente (más reciente primero)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object}}

  /api/keygen/rates:
    post:
      tags: [License]
      summary: Creador de Licencias — actualizar tasas de cambio (CUP)
      operationId: keygenRates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rates:
                  type: object
                  additionalProperties: {type: number, description: "CUP por unidad (USD, EUR, MLC, CAD, MXN, ZELLE, CLA)"}
      responses:
        '200': {description: Tasas guardadas en keygen/tasas.json}
        '400': {description: Tasa no válida}
        '401': {description: Sin sesión}
        '403': {description: Solo administradores}

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesión
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciales inválidas
        '423':
          description: Cuenta bloqueada temporalmente (5 intentos fallidos)
        '429':
          description: Demasiados intentos (5 por minuto)

  /api/auth/refresh:
    post:
      tags: [Authentication]
      summary: Refrescar token de acceso
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refrescado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Cerrar sesión (revoca el refresh token)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200': { description: Sesión cerrada }

  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Usuario autenticado actual, con sus permisos por módulo
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  jwt: { type: boolean }
                  permissions: { $ref: '#/components/schemas/Permissions' }
                  modules:
                    type: object
                    description: Etiqueta visible de cada módulo
                    additionalProperties: { type: string }

  /api/users:
    get:
      tags: [Authentication]
      summary: Listar usuarios (solo admin)
      responses:
        '200': { description: Lista de usuarios }
    post:
      tags: [Authentication]
      summary: Crear usuario (solo admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password, role]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                password: { type: string, minLength: 10 }
                role: { type: string, enum: [admin, editor, viewer] }
                permissions:
                  $ref: '#/components/schemas/Permissions'
      responses:
        '201': { description: Usuario creado, con sus permisos efectivos }
        '400': { description: Permisos con módulos o claves no válidos }
        '409': { description: Correo duplicado }

  /api/events:
    get:
      tags: [System]
      summary: Flujo de cambios en tiempo real (Server-Sent Events)
      description: Acepta `?access_token=` porque EventSource no permite cabeceras.
      responses:
        '200':
          description: text/event-stream con eventos `ready` y `change`

  /api/version:
    get:
      tags: [Health]
      summary: Versión de la API y capacidades
      security: []
      responses:
        '200': { description: Versión }

  /api/openapi.yaml:
    get:
      tags: [Health]
      summary: Esta especificación
      security: []
      responses:
        '200': { description: Documento OpenAPI }

  /api/materials/{id}:
    delete:
      tags: [Materials]
      summary: Desactivar valor de referencia (borrado lógico)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Valor desactivado }

  /api/auth/2fa/setup:
    post:
      tags: [Authentication]
      summary: Iniciar configuración de verificación en dos pasos (devuelve secreto y URI otpauth)
      responses: { '200': { description: Secreto TOTP } }
  /api/auth/2fa/enable:
    post:
      tags: [Authentication]
      summary: Confirmar código TOTP y activar (devuelve 8 códigos de recuperación)
      responses: { '200': { description: Activada }, '400': { description: Código incorrecto } }
  /api/auth/2fa/disable:
    post:
      tags: [Authentication]
      summary: Desactivar 2FA (requiere contraseña y código)
      responses: { '200': { description: Desactivada } }
  /api/auth/password:
    post:
      tags: [Authentication]
      summary: Cambiar contraseña (revoca las demás sesiones; no permite reutilizar las últimas N)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string, format: password }
                new: { type: string, format: password, minLength: 10 }
      responses:
        '200':
          description: Cambiada. Devuelve tokens nuevos para este dispositivo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { description: Contraseña actual incorrecta, débil o reutilizada }
  /api/users/{id}:
    put:
      tags: [Authentication]
      summary: Actualizar usuario (rol, activo, desbloquear, restablecer 2FA, revocar sesiones, forzar cambio de contraseña) y sus permisos por módulo — admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { type: string, enum: [admin, editor, viewer] }
                active: { type: boolean }
                unlock: { type: boolean }
                reset_mfa: { type: boolean }
                revoke_sessions: { type: boolean }
                force_password_change: { type: boolean }
                permissions:
                  $ref: '#/components/schemas/Permissions'
                reset_permissions:
                  type: boolean
                  description: Borra los ajustes y deja al usuario con los permisos de su rol
      responses:
        '200': { description: Usuario actualizado, con sus permisos efectivos }
        '400': { description: Permisos no válidos o intento de limitar a un administrador }
        '404': { description: Usuario no encontrado }
  /api/products/{id}/restore:
    post:
      tags: [Products]
      summary: Reactivar un producto desactivado (deshacer) — editor/admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Producto reactivado }
        '404': { description: No existe o ya está activo }
  /api/materials/{id}/restore:
    post:
      tags: [Materials]
      summary: Reactivar un valor del IPV desactivado (deshacer) — editor/admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Valor reactivado }
        '404': { description: No existe o ya está activo }
  /api/auth/sessions:
    get:
      tags: [Authentication]
      summary: Dispositivos con sesión abierta del usuario actual
      responses:
        '200':
          description: Lista de sesiones
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    device: { type: string, example: "Chrome · Windows" }
                    ip: { type: string }
                    created_at: { type: string, format: date-time }
                    last_seen: { type: string, format: date-time }
                    current: { type: boolean }
  /api/auth/sessions/{sid}:
    delete:
      tags: [Authentication]
      summary: Cerrar la sesión de un dispositivo propio (sus tokens dejan de valer al instante)
      parameters:
        - { name: sid, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Sesión cerrada }
        '404': { description: No existe o pertenece a otro usuario }
  /api/auth/sessions/revoke-others:
    post:
      tags: [Authentication]
      summary: Cerrar todas las sesiones excepto la actual
      responses: { '200': { description: "Número de sesiones cerradas (closed)" } }
  /api/audit/verify:
    get:
      tags: [System]
      summary: Verificar integridad de la cadena de auditoría (HMAC-SHA256) — admin
      responses: { '200': { description: Resultado de la verificación } }
  /api/security/status:
    get:
      tags: [System]
      summary: Estado de los controles de seguridad activos
      responses: { '200': { description: Estado } }

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Obtener resumen del dashboard
      operationId: getDashboard
      description: >
        El resumen mezcla datos de todos los apartados y se recorta según los permisos del usuario:
        sin `view` sobre un módulo, sus contadores llegan en `null`, sus listas en `[]` y sus eventos
        desaparecen de `activity_timeline`. Sin `costs` en `materials`, `stock_value` llega en `null`
        con `costs_hidden: true`; sin `costs` en `fichas`, `cost_by_category` llega vacío y
        `recent_fichas[].total_cost` en `null`.
      responses:
        '200':
          description: Datos del dashboard, recortados según los permisos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

  /api/products:
    get:
      tags: [Products]
      summary: Listar productos
      operationId: listProducts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Products]
      summary: Crear producto
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

  /api/products/{id}:
    delete:
      tags: [Products]
      summary: Desactivar producto (soft delete)
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Producto desactivado

  /api/materials:
    get:
      tags: [Materials]
      summary: Listar valores de referencia (pestaña Valores)
      description: Exige `materials.view`. Sin `materials.costs`, `unit_price` llega como null.
      operationId: listMaterials
      responses:
        '200':
          description: Lista de materiales
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
        '403': { $ref: '#/components/responses/PermisoDenegado' }
    post:
      tags: [Materials]
      summary: Crear valor de referencia (exige `materials.edit`)
      operationId: createMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaterialCreate'
      responses:
        '201':
          description: Material creado
        '403': { $ref: '#/components/responses/PermisoDenegado' }

  /api/inventory:
    get:
      tags: [Materials]
      summary: Inventario de valores del IPV (segunda pestaña de la misma entrada)
      description: |
        Existencias de cada valor del IPV, recetas que lo usan y cuántas raciones o
        copas se pueden preparar. Exige el permiso `materials.view`; el ajuste de
        existencias (`POST /api/materials/{id}/stock`) exige `materials.edit`.
        Sin `materials.costs`, `unit_price`, `stock_value` y `totals.stock_value`
        llegan como null y la respuesta incluye `costs_hidden: true`.
        Editar existencias o metadatos sin ver costos no autoriza fijar `unit_price`
        o `currency`. La actualización masiva de precios exige `materials.costs`.
        Las líneas libres de fichas con costo manual exigen `fichas.costs`.
        Restaurar/purgar elementos exige `trash.edit` y `edit` de su módulo;
        vaciar exige `edit` en todos los módulos además de `trash.edit`.
        Los datos de prueba exigen `edit` en los cuatro módulos y `materials.costs`.
      operationId: getInventory
      parameters:
        - { name: category, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: low, in: query, schema: { type: string }, description: "1 = solo bajo mínimo" }
      responses:
        '200':
          description: Inventario con totales
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryItem' }
                  totals:
                    type: object
                    properties:
                      materials: { type: integer }
                      low_stock: { type: integer }
                      categories: { type: integer }
                      stock_value:
                        type: string
                        nullable: true
                        description: null sin el permiso `materials.costs`
                  costs_hidden:
                    type: boolean
                    description: Presente y en true cuando el usuario no puede ver importes
        '403': { $ref: '#/components/responses/PermisoDenegado' }

  /api/materials/bulk-update:
    post:
      tags: [Materials]
      summary: Actualización masiva de precios
      operationId: bulkUpdateMaterials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateRequest'
      responses:
        '200':
          description: Resultados de la actualización

  /api/fichas:
    get:
      tags: [Fichas]
      summary: Listar fichas de costo
      operationId: listFichas
      responses:
        '200':
          description: Lista de fichas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ficha'
    post:
      tags: [Fichas]
      summary: Crear ficha de costo
      operationId: createFicha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FichaCreate'
      responses:
        '201':
          description: Ficha creada

  /api/fichas/{id}:
    get:
      tags: [Fichas]
      summary: Obtener detalle de ficha
      operationId: getFicha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de ficha
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaDetail'
    put:
      tags: [Fichas]
      summary: Actualizar ficha (solo borradores)
      operationId: updateFicha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FichaUpdate'
      responses:
        '200':
          description: Ficha actualizada

  /api/fichas/{id}/approve:
    post:
      tags: [Fichas]
      summary: Aprobar ficha de costo
      operationId: approveFicha
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Ficha aprobada

  /api/controls:
    get:
      tags: [Controls]
      summary: Listar controles de IPV
      operationId: listControls
      responses:
        '200':
          description: Lista de controles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Control'
    post:
      tags: [Controls]
      summary: Crear control de IPV
      operationId: createControl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCreate'
      responses:
        '201':
          description: Control creado

  /api/controls/{id}/validate:
    post:
      tags: [Controls]
      summary: Validar control de IPV
      operationId: validateControl
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Control validado

  /api/search:
    get:
      tags: [Search]
      summary: Búsqueda global
      operationId: globalSearch
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResult'

  /api/statistics:
    get:
      tags: [Reports]
      summary: Obtener estadísticas avanzadas
      operationId: getStatistics
      description: >
        Exige `fichas.view` (403 `permission_denied: fichas.view` en caso contrario). Sin `fichas.costs`,
        `top_expensive[].total_cost` y `avg_cost_by_category[].avg_cost` llegan en `null`.
      responses:
        '403':
          $ref: '#/components/responses/PermisoDenegado'
        '200':
          description: Estadísticas del sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'

  /api/report/{type}:
    get:
      tags: [Reports]
      summary: Generar reporte
      operationId: generateReport
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [fichas_summary, materials_inventory, controls_pending]
      responses:
        '200':
          description: Reporte generado

  /api/backup:
    get:
      tags: [System]
      summary: Crear backup de la base de datos
      operationId: createBackup
      responses:
        '200':
          description: Backup creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupResponse'

  /api/audit:
    get:
      tags: [System]
      summary: Registro de auditoría persistente (solo admin)
      operationId: getAuditLog
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: action, in: query, schema: { type: string } }
        - { name: q, in: query, description: Texto en detalles, IP o usuario, schema: { type: string } }
      responses:
        '200':
          description: Log de auditoría

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    PermisoDenegado:
      description: El usuario no tiene el permiso del módulo (Sistema de Seguridad por Usuarios)
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: "Su usuario no tiene permiso para modificar «Valores del IPV e Inventario»." }
              permission_denied: { type: string, example: "materials.edit" }

  schemas:
    ModulePermission:
      type: object
      description: >
        Permisos de un módulo. `edit` y `costs` implican `view`. Al enviarlos por `PUT /api/users/{id}`
        se puede incluir solo lo que cambia: los permisos ausentes conservan el valor del rol.
      properties:
        view: { type: boolean, description: Abrir el apartado y consultar sus datos }
        edit: { type: boolean, description: Crear, modificar, ajustar existencias, restaurar y purgar }
        costs: { type: boolean, description: Ver precios, importes y valores en dinero }

    Permissions:
      type: object
      description: Permisos efectivos por módulo (`materials` = Valores del IPV e Inventario)
      properties:
        materials: { $ref: '#/components/schemas/ModulePermission' }
        products: { $ref: '#/components/schemas/ModulePermission' }
        fichas: { $ref: '#/components/schemas/ModulePermission' }
        controls: { $ref: '#/components/schemas/ModulePermission' }
        trash: { $ref: '#/components/schemas/ModulePermission' }

    InventoryItem:
      allOf:
        - $ref: '#/components/schemas/Material'
        - type: object
          properties:
            stock_value:
              type: string
              nullable: true
              description: existencias × precio unitario (null sin permiso `costs`)
            low_stock: { type: boolean }
            usage_count: { type: integer }
            used_by:
              type: array
              description: Recetas que usan el insumo y cuántas raciones salen con el stock actual
              items:
                type: object
                properties:
                  ficha_id: { type: integer }
                  product_id: { type: integer }
                  product_code: { type: string }
                  product_name: { type: string }
                  category: { type: string }
                  ficha_status: { type: string }
                  per_serving: { type: string }
                  yield_unit: { type: string }
                  servings: { type: integer, nullable: true }


    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        database:
          type: string
        file:
          type: string
        time:
          type: string
          format: date-time
        version:
          type: string
        tls:
          type: boolean
        auth_required:
          type: boolean

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
        permissions:
          $ref: '#/components/schemas/Permissions'
        session_id:
          type: string
          description: Identificador de la sesión de este dispositivo (solo en login)
        new_ip:
          type: boolean
          description: Acceso desde una IP nunca usada por el usuario (se audita y se avisa por correo)
        password_expired:
          type: boolean
          description: Si es true, el resto de la API responde 403 {password_expired:true} hasta cambiar la contraseña
        password_expires_in_days:
          type: integer
          nullable: true
          description: Días hasta que caduca la contraseña (null = sin caducidad)
        failed_attempts_since_last_login:
          type: integer
          description: Intentos fallidos contra esta cuenta desde el último acceso correcto (se muestra al usuario)
        last_failed_ip:
          type: string
          nullable: true
          description: IP del último intento fallido, si lo hubo

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string

    DashboardResponse:
      type: object
      properties:
        products:
          type: integer
        materials:
          type: integer
        fichas:
          type: integer
        approved_fichas:
          type: integer
        pending_controls:
          type: integer
        validated_controls:
          type: integer
        recent_fichas:
          type: array
          items:
            type: object
        categories:
          type: array
          items:
            type: object
        cost_by_category:
          type: array
          items:
            type: object
        activity_timeline:
          type: array
          items:
            type: object

    Product:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        category:
          type: string
        unit:
          type: string
        description:
          type: string
        active:
          type: integer
        ficha_count:
          type: integer

    ProductCreate:
      type: object
      required: [code, name, category]
      properties:
        code:
          type: string
          maxLength: 30
        name:
          type: string
          maxLength: 200
        category:
          type: string
          maxLength: 100
        unit:
          type: string
          default: unidad
        description:
          type: string
          maxLength: 1000

    Material:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        unit:
          type: string
        currency:
          type: string
        unit_price:
          type: string
        supplier:
          type: string
        source:
          type: string
        effective_from:
          type: string
        status:
          type: string

    MaterialCreate:
      type: object
      required: [code, name, unit, unit_price]
      properties:
        code:
          type: string
        name:
          type: string
        unit:
          type: string
        unit_price:
          type: number
        currency:
          type: string
          enum: [CUP, MLC, USD, EUR]
          default: CUP
        supplier:
          type: string
        source:
          type: string

    BulkUpdateRequest:
      type: object
      required: [updates]
      properties:
        updates:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              price:
                type: number

    Ficha:
      type: object
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        product_code:
          type: string
        category:
          type: string
        version:
          type: integer
        status:
          type: string
        total_cost:
          type: string
        valid_from:
          type: string
        item_count:
          type: integer
        control_count:
          type: integer

    FichaCreate:
      type: object
      required: [product_id, items]
      properties:
        product_id:
          type: integer
        valid_from:
          type: string
          format: date
        observations:
          type: string
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              material_id:
                type: integer
              quantity:
                type: number

    FichaUpdate:
      type: object
      properties:
        valid_from:
          type: string
        observations:
          type: string
        items:
          type: array
          items:
            type: object

    FichaDetail:
      allOf:
        - $ref: '#/components/schemas/Ficha'
        - type: object
          properties:
            items:
              type: array
              items:
                type: object
            observations:
              type: string

    Control:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        product_name:
          type: string
        product_code:
          type: string
        period:
          type: string
        status:
          type: string
        snapshot_total:
          type: string
        checked_total:
          type: string
        ficha_version:
          type: integer

    ControlCreate:
      type: object
      required: [ficha_id, period]
      properties:
        ficha_id:
          type: integer
        period:
          type: string
          pattern: '^\d{4}-\d{2}$'
        notes:
          type: string

    SearchResult:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [product, material, ficha, control]
        name:
          type: string
        code:
          type: string

    Statistics:
      type: object
      properties:
        monthly_trend:
          type: array
          items:
            type: object
        top_expensive:
          type: array
          items:
            type: object
        status_distribution:
          type: array
          items:
            type: object
        avg_cost_by_category:
          type: array
          items:
            type: object

    BackupResponse:
      type: object
      properties:
        success:
          type: boolean
        filename:
          type: string
        size:
          type: integer
        created_at:
          type: string

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

security:
  - BearerAuth: []
