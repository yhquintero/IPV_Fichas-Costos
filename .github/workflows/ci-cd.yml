# IPV Fichas y Costos - CI/CD
# Autor: Ing. Yosvany Hernández Quintero
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Calidad, seguridad y pruebas
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Verificar sintaxis JavaScript de la interfaz web
        run: node --check web/app.js
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r requirements-dev.txt
      - name: Auditoría de dependencias de desarrollo
        run: pip-audit -r requirements-dev.txt
      - name: Ruff (errores reales)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Bandit (severidad media/alta)
        run: bandit -q -r server.py auth.py audit.py rate_limiter.py enterprise.py security.py dbcrypt.py offsite.py licencia.py keygen/keygen.py email_notifications.py permisos.py -ll -ii
      - name: Pruebas con cobertura
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m --include="*.py" --omit="tests/*"
      - name: Pruebas con la base de datos cifrada (SQLCipher)
        env:
          IPV_DB_KEY: "clave-ci-solo-para-pruebas-${{ github.run_id }}"
        run: |
          pip install sqlcipher3-binary
          python -m unittest discover -s tests

  powershell:
    name: Sintaxis de inicio HTTPS en Windows PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analizar el script sin ejecutarlo
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'iniciar-https.ps1'), [ref]$tokens, [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List * | Out-String | Write-Error
          }

  zap:
    name: OWASP ZAP (escaneo dinámico de seguridad)
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    env:
      IPV_PORT: "8000"
      IPV_DB_PATH: ${{ github.workspace }}/zap-data/ipv.db
      IPV_ADMIN_EMAIL: zap@ipv.local
      IPV_BACKUP_INTERVAL_HOURS: "0"
      IPV_RATE_LIMIT_SCALE: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Arrancar el servidor (JWT activo, datos de ejemplo)
        run: |
          echo "IPV_JWT_SECRET=$(python -c 'import secrets;print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "IPV_ADMIN_PASSWORD=Zap#$(python -c 'import secrets;print(secrets.token_urlsafe(18))')" >> "$GITHUB_ENV"
      - name: Servidor en segundo plano
        run: |
          nohup python server.py > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Obtener token para el escaneo autenticado
        run: |
          TOKEN=$(curl -sf -X POST http://127.0.0.1:8000/api/auth/login -H 'Content-Type: application/json' \
            -d "{\"email\":\"$IPV_ADMIN_EMAIL\",\"password\":\"$IPV_ADMIN_PASSWORD\"}" \
            | python -c 'import json,sys;print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$TOKEN"
          echo "ZAP_AUTH_HEADER_VALUE=Bearer $TOKEN" >> "$GITHUB_ENV"
          echo "ZAP_AUTH_HEADER_SITE=127.0.0.1" >> "$GITHUB_ENV"
      - name: ZAP Baseline (interfaz web)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:8000/
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j -I"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
      - name: Revisar alertas del escaneo web
        run: python .zap/revisar_alertas.py report_json.json "ZAP Baseline"
      - name: Especificación OpenAPI apuntando al servidor de CI
        run: |
          python - <<'PY'
          import re, pathlib
          spec = pathlib.Path("docs/openapi.yaml").read_text(encoding="utf-8")
          spec = re.sub(r"servers:\n(?:  - .*\n(?:    .*\n)*)+", "servers:\n  - url: http://127.0.0.1:8000\n", spec, count=1)
          pathlib.Path("zap-openapi.yaml").write_text(spec, encoding="utf-8")
          PY
          grep -A1 "^servers:" zap-openapi.yaml
      - name: ZAP API Scan (OpenAPI, autenticado)
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: zap-openapi.yaml
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -I"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-api
      - name: Revisar alertas del escaneo de la API
        run: python .zap/revisar_alertas.py report_json.json "ZAP API"
      - name: Registro del servidor
        if: always()
        run: tail -n 200 server.log

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target production -t ipv-fichas-costos:ci .

  browser-e2e:
    name: Prueba E2E del Creador de Licencias (Chromium)
    runs-on: ubuntu-latest
    needs: quality
    env:
      IPV_PORT: "8011"
      IPV_DB_PATH: ${{ github.workspace }}/e2e-data/e2e.db
      IPV_ADMIN_EMAIL: admin-e2e@ipv.local
      IPV_ADMIN_PASSWORD: E2E-solo-CI-password-2026
      IPV_JWT_SECRET: e2e-only-jwt-secret-not-for-production-2026-abcdef0123456789
      IPV_BACKUP_INTERVAL_HOURS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Instalar dependencias de servidor y navegador
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Crear código sintético para cliente de prueba
        run: |
          echo "IPV_E2E_REQUEST_CODE=$(python -c 'import licencia; print(licencia.request_code(licencia.APP_WEB, "browser-e2e-client"))')" >> "$GITHUB_ENV"
      - name: Arrancar servidor con base temporal y JWT de prueba
        run: |
          mkdir -p e2e-data
          nohup python server.py > e2e-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8011/api/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat e2e-server.log
          exit 1
      - name: Ejecutar el flujo completo PX en Chromium
        run: npm run test:e2e
      - name: Guardar trazas y capturas si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-debug-${{ github.sha }}
          path: |
            test-results/playwright/
            e2e-server.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Compilación Android
    runs-on: ubuntu-latest
    needs: quality
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar variantes debug y release sin firmar
        run: gradle assembleDebug assembleRelease --no-daemon
      - name: Guardar APKs de validación (sin firmar para distribución)
        uses: actions/upload-artifact@v4
        with:
          name: android-apks-${{ github.sha }}
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
